<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
     <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
   
function ChatInput(){
  return(
    <>
      <input placeholder="Send message to ChatBot" size="30" />
      <button>Send</button>  
    </>
  );
}

function ChatMessage({message,sender}){
 
 
  return(
    <div>
      {sender === 'robot' &&  <img src="robot.png" alt="" width="50" />}
  {message}
 {sender === 'user' &&  <img src="user.png" alt="" width="50" />}
    </div>
  );
}

function App(){
  return(
    <>
          <ChatInput />
          <ChatMessage message="hello chatbot1" sender="user" />
           <ChatMessage message="hii how are you" sender="robot" />
            <ChatMessage message="i am fine " sender="user" />
             <ChatMessage message="good!" sender="robot" />
          </>
  );
}

       
      const container = document.querySelector('.js-container');
        const root=ReactDOM.createRoot(container);
        root.render(<App />)


      
    </script>
  </body>
</html>
