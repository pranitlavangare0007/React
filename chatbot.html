<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
     <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
   


function ChatInput({chatMessage,setChatMessage}){
 const[currentText,setInputText]=React.useState('');
const [isLoading,setIsLoading] = React.useState(false);


function handleChange(event){
 setInputText( event.target.value)
}

 function saveInputText(event){
  
  
   if(event.key==='Enter' ){
    sendMessage()
   }
   
   if(event.key==="Escape"){
    setInputText('')
   }
 }
async function sendMessage(){

   if(!currentText.trim() || isLoading) return;

    const text = currentText;
 
const newMessage =(prev =>[
  ...prev,
  {
    message:text,
    sender:"user",
    id:crypto.randomUUID()
  }
 ])
  setInputText("");
    setIsLoading(true);
 const loadingId = crypto.randomUUID();

    setChatMessage(prev => [
      ...prev,
      {
        message:"Loading...",
        sender:"robot",
        id:loadingId
      }
    ]);

 const response =await Chatbot.getResponseAsync(currentText);
  setChatMessage(prev =>
      prev.map(msg =>
        msg.id === loadingId
          ? {...msg, message: response || "No response"}
          : msg
      )
    );
    setIsLoading(false);

 }
  return(
    <>
      <input
       placeholder="Send message to ChatBot" 
       size="30" 
       onChange={handleChange}
       value={currentText}
       onKeyDown={saveInputText}
        disabled={isLoading}
       />
      <button onClick={sendMessage} disabled={isLoading || !currentText.trim()}>Send</button> 
     
    </>
  );
}

function ChatMessage({message,sender}){
 
 
  return(
    <div>
      {sender === 'robot' &&  <img src="robot.png" alt="" width="50" />}
  {message}
  {sender === 'user' &&  <img src="user.png" alt="" width="50" />}
    </div>
  );
}


function ChatMessages ({chatMessage}){

return(
  <>
          
         {chatMessage.map((chatMessage)=>{
            return(
                 <ChatMessage 
                    message={chatMessage.message} 
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                 />
                );
             })}
         </>
        );
      }
    
        function App(){
          let [chatMessage,setChatMessage]=React.useState(
    [
  {
    message:"hello chatbot1",
    sender:"user",
    id:"1"
  },
  {
    message:"hii how are you",
    sender:"robot",
    id:"2"
  },
  {
    message:"i am fine ",
    sender:"user",
    id:"3"
  },
  {
    message:"good!",
    sender:"robot",
    id:"4"
  }
]);
          return(
            <>
                  <ChatInput
                  chatMessage={chatMessage}
                  setChatMessage={setChatMessage}
                  />
                  <ChatMessages
                  chatMessage={chatMessage}
                  />
                  </>
          );
        }
        const container = document.querySelector('.js-container');
        const root=ReactDOM.createRoot(container);
        root.render(<App />)


      
    </script>
  </body>
</html>
