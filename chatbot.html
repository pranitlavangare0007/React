<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial;
        margin: 0
      }
      .send-btn{
        background-color: rgb(25,135,84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input{
        padding: 10px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-cont{
          display: flex;
          margin-bottom: 60px;
         
      }
      .app-cont{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-msg-user{
        display: flex;
        justify-content: end;
        align-items: start;
      }

      .chat-msg-robot{
        display: flex;
        align-items: start;
      }
      .chat-msg-text{
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;

      }

      .chat-img{
        width: 45px;
      }
      
      .chat-msg-cont{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
        
      }

      .welcome-cont{
       
  
        text-align: center;
        padding: auto;
        height: 100vh;
      }
      .welcome-cont h1{
        margin-top: 300px;
      }
      .loading-spinner{
        height: 40px;
        margin: -15px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
     <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
   

function useAutoScroll(dependencies){
 const chatMsgRef=React.useRef(null);
  React.useEffect(()=>{
   const contElm= chatMsgRef.current;
   if(contElm){
    contElm.scrollTop=contElm.scrollHeight;
   }
  },[dependencies]);

  return chatMsgRef;
}

function ChatInput({chatMessage,setChatMessage}){
 const[currentText,setInputText]=React.useState('');
const [isLoading,setIsLoading] = React.useState(false);


function handleChange(event){
 setInputText( event.target.value)
}

 function saveInputText(event){
  
  
   if(event.key==='Enter' ){
    sendMessage()
   }
   
   if(event.key==="Escape"){
    setInputText('')
   }
 }
async function sendMessage(){

   if(!currentText.trim() || isLoading) return;

    const text = currentText;
 
const newMessage =(prev =>[
  ...prev,
  {
    message:text,
    sender:"user",
    id:crypto.randomUUID()
  }
 ])
 setChatMessage(newMessage)
  setInputText("");
    setIsLoading(true);
 const loadingId = crypto.randomUUID();

    setChatMessage(prev => [
      ...prev,
      {
        message:<img className="loading-spinner" src="./loading-spinner.gif"/>,
        sender:"robot",
        id:loadingId
      }
    ]);

 const response =await Chatbot.getResponseAsync(currentText);
  setChatMessage(prev =>
      prev.map(msg =>
        msg.id === loadingId
          ? {...msg, message: response || "No response"}
          : msg
      )
    );
    setIsLoading(false);

 }
  return(
    <div className="chat-input-cont">
      <input
       placeholder="Send message to ChatBot" 
       size="30" 
       onChange={handleChange}
       value={currentText}
       onKeyDown={saveInputText}
        disabled={isLoading}
        className="chat-input"
       />
      <button onClick={sendMessage} 
      disabled={isLoading || !currentText.trim()}
      className="send-btn"
      >Send</button> 
     
    </div>
  );
}

function ChatMessage({message,sender}){
 
  
 
  return(
    <div className={
      sender==="user"
      ?'chat-msg-user'
      :'chat-msg-robot'}>
      {sender === 'robot' &&  <img src="robot.png" alt="" className="chat-img" />}
  <div className="chat-msg-text">
    {message}
  </div>
  {sender === 'user' &&  <img src="user.png" alt=""  className="chat-img" />}
    </div>
  );
}


function ChatMessages ({chatMessage}){
 let chatMsgRef=useAutoScroll(chatMessage);

  if(chatMessage.length===0){
    return(
      <div className="welcome-cont">
      <h1>welcome to the chatbot project! Send a message using textbox below.</h1>
        </div>
    );
  }

return(
  <div className="chat-msg-cont" ref={chatMsgRef}>
          
         {chatMessage.map((chatMessage)=>{
            return(
                 <ChatMessage 
                    message={chatMessage.message} 
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                 />
                );
             })}
         </div>
        );
      }
    
        function App(){
          let [chatMessage,setChatMessage]=React.useState(
    []);
    
          return(
            <div className="app-cont">
                 
                  <ChatMessages
                  chatMessage={chatMessage}
                  />
                   <ChatInput
                  chatMessage={chatMessage}
                  setChatMessage={setChatMessage}
                  />
                  </div>
          );
        }
        const container = document.querySelector('.js-container');
        const root=ReactDOM.createRoot(container);
        root.render(<App />)


      
    </script>
  </body>
</html>
