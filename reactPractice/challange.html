<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
     <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
   
   
      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container);

      function Ecomm({title,Price,discount,image}){
      
        const result = discount ? <><del> <p>Price :${Price}</p></del> <p>Discount Price : ${discount}</p> </>: <p>Price :${Price}</p>;
         
        return(
          <div>
          <img src={image} alt="" width="70"/>
          <h4>{title}</h4>
        {result}
          <button>Add to Cart</button>
          </div>
        );
      }
      

     function App(){
      return(
        <div>
       <Ecomm title="Cotton socks" Price="100" discount="50" image="Cotton-socks.png"/>
       <Ecomm title="Tennise Ball" Price="200" image="tennis-balls.png"/>
      
        </div>
      );
     }

     root.render(<App />)
      
    </script>
  </body>
</html>
